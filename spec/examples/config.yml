# In your app, this file lives at plgkit/nudges/config.yml. It is Nudges-only.
# decide() joins relative `asset` values in render_props with assets_base_url before returning.
assets_base_url: "/static/nudges/"

# Max winners decide() may return for a location. A location not listed defaults to 1.
location_limits:
  home: 2
  get-started: 1

# Max winners on one surface within that location. A surface not listed defaults to 1.
surface_limits:
  main-top: 2
  modal: 1
