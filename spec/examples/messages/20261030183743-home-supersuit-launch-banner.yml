location: "home" # Required. Missing = fail closed: the message is never returned.
surface: "main-top" # Required. Missing = fail closed.
active: # UTC. A date with no time is midnight UTC. Missing from = active immediately. Missing to = live forever. to is exclusive at that instant.
  from: "2026-10-30"
  to: "2050-01-28"
priority: 5 # Optional, default 100. Lower numbers win. Ties break by filename, which with the timestamp prefix means the older message wins.
max_impressions: 5 # Count of impression(nudge_id, event) calls for this user_id. decide() only reads it.
audience: # Optional. Omitted entirely means everyone matches. Omitted require_all or require_one_of passes; omitted exclude excludes no one. Functions live in plgkit/nudges/audiences.py (Go: plgkit/nudges/audiences.go, TypeScript: plgkit/nudges/audiences.ts)
  require_all: [is_human, is_adult]
  require_one_of: [is_usa_resident, is_uk_resident]
  exclude: [is_staff, is_duck]
component: "Banner" # Required universal name, never a framework path. The renderer registry maps it to the real component.
render_props: # Required. {} is valid. Opaque to the core and passed through as props. Missing = fail closed.
  dismissible: true # Presentation only: show a close control. Does not gate dismiss(nudge_id, event).
  asset: "20261030183743-home-supersuit-launch-banner/banner.png" # Relative. decide() joins it with assets_base_url.
  title: "Supersuit v0 available in beta."
  body: "The people's first supersuit brings you levitation, accelerated movements, and more. Take it to new heights."
  primary_cta:
    text: "Join the waitlist"
    url: "https://supersuit.tech/examples/v0-waitlist"
    dismiss_on_click: true # This control calls click, then dismiss, for this nudge.
