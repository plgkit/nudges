location: "get-started" # Required. Missing = fail closed: the message is never returned.
surface: "modal" # Required. Missing = fail closed.
active: # UTC. A date with no time is midnight UTC. Missing from = active immediately. Missing to = live forever. to is exclusive at that instant.
  from: "2026-10-30"
priority: 1 # Optional, default 100. Lower numbers win. Ties break by filename, which with the timestamp prefix means the older message wins.
max_impressions: 5000000 # Count of impression(nudge_id, event) calls for this user_id. decide() only reads it.
dismiss_scope: [organization_id] # Dismissal counts only when these ctx keys match. Omitted = everywhere for that user.
audience: # Optional. Omitted entirely means everyone matches. Omitted require_all or require_one_of passes; omitted exclude excludes no one. Functions live in plgkit/nudges/audiences.py (Go: plgkit/nudges/audiences.go, TypeScript: plgkit/nudges/audiences.ts)
  require_all: [has_active_supersuit_subscription]
component: "OnboardingModal" # Required universal name, never a framework path. The renderer registry maps it to the real component.
render_props: # Required. {} is valid. Opaque to the core and passed through as props. Missing = fail closed.
  dismissible: true # Presentation only: show a close control. Does not gate dismiss(nudge_id, event).
  slides:
    - title: "It's time to suit up"
      subtitle: "You need to believe, to achieve."
      asset: "20261102131452-get-started-supersuit-onboarding-modal/slide_1.png" # Relative. decide() joins it with assets_base_url.
      primary_cta:
        text: "Activate your suit"
        url: "https://supersuit.tech/examples/activate-your-suit"
        dismiss_on_click: true # This control calls click, then dismiss, for this nudge.
    - title: "Power up your gauntlets"
      subtitle: "Charge them overnight so you're ready when duty calls."
      asset: "20261102131452-get-started-supersuit-onboarding-modal/slide_2.png"
      primary_cta:
        text: "View power settings"
        url: "https://supersuit.tech/examples/power-settings"
        dismiss_on_click: true
    - title: "Join the hero network"
      subtitle: "Connect with other supersuits in your city and share tips."
      asset: "20261102131452-get-started-supersuit-onboarding-modal/slide_3.png"
      primary_cta:
        text: "Open the network"
        url: "https://supersuit.tech/examples/hero-network"
        dismiss_on_click: true
